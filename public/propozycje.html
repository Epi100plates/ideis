<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Propozycje i błędy — Plan zajęć</title>
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04070c">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
  /* Strona jest samodzielna (bez app.js i service workera): ma działać także
     wtedy, gdy ktoś otworzy ją z zakładki albo z linku w wiadomości. Kolory
     i promienie są te same co w aplikacji, żeby nie wyglądała jak inny serwis. */
  @font-face {
    font-family: 'Roboto';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('/fonts/Roboto-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
      U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212,
      U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Roboto';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('/fonts/Roboto-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
      U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
      U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    --page: #04070c;
    --panel: #12161d;
    --panel-veil: rgba(255, 255, 255, 0.04);
    --edge: rgba(255, 255, 255, 0.10);
    --text: #e8eef6;
    --soft: #9db0c4;
    --accent: #8ab4ff;
    --accent-ink: #04121f;
    --field: #0a0f16;
    --idea: #8ab4ff;
    --bug: #ffb59b;
    --danger: #ffb4ab;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --page: #eef3fb;
      --panel: #ffffff;
      --panel-veil: rgba(16, 32, 52, 0.03);
      --edge: rgba(16, 32, 52, 0.14);
      --text: #16202c;
      --soft: #5a6a7c;
      --accent: #1d5fd0;
      --accent-ink: #ffffff;
      --field: #f4f7fc;
      --idea: #1d5fd0;
      --bug: #a8420f;
      --danger: #b3261e;
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 48px;
    background: radial-gradient(120% 90% at 10% -10%, rgba(94, 140, 255, .18) 0%, transparent 60%), var(--page);
    background-attachment: fixed;
    color: var(--text);
    font: 15px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 22px; line-height: 28px; margin: 0; font-weight: 500; }
  .back { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 14px; }
  .back:hover, .back:focus-visible { text-decoration: underline; }
  .hint { color: var(--soft); font-size: 13px; margin: 6px 0 18px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 14px;
  }
  label { display: block; font-size: 13px; color: var(--soft); margin-bottom: 6px; }
  select, textarea, button {
    font: inherit;
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--edge);
    border-radius: 12px;
    padding: 10px 12px;
    width: 100%;
  }
  textarea { min-height: 104px; resize: vertical; }
  select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .count { color: var(--soft); font-size: 12px; margin-left: auto; white-space: nowrap; }
  button {
    width: auto;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 20px;
    padding: 10px 22px;
    font-weight: 600;
    cursor: pointer;
  }
  button[disabled] { opacity: .55; cursor: default; }
  .status { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li.item {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 18px;
    padding: 12px 14px;
  }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--soft); }
  .badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid currentColor;
  }
  .badge.idea { color: var(--idea); }
  .badge.bug { color: var(--bug); }
  .message { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; }
  .remove {
    width: auto;
    margin-left: auto;
    background: transparent;
    color: var(--danger);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .empty { color: var(--soft); font-size: 14px; }
  .list-head { display: flex; align-items: center; gap: 10px; margin: 18px 2px 10px; }
  .list-head strong { font-size: 14px; }
  .list-head .count-total { color: var(--soft); font-size: 13px; }
  .refresh {
    margin-left: auto;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--edge);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 13px;
    font-weight: 500;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Propozycje i błędy</h1>
    <a class="back" href="/">← wróć do planu</a>
  </header>
  <p class="hint">
    Zgłoszenia są anonimowe — bez konta i bez adresu e-mail. Wysyła je także
    aplikacja Android (Opcje → Propozycje / błędy) i ta strona.
  </p>

  <form class="card" id="form">
    <label for="kind">Rodzaj zgłoszenia</label>
    <select id="kind" name="kind">
      <option value="idea">Propozycja nowej funkcji</option>
      <option value="bug">Zgłoszenie błędu</option>
    </select>

    <label for="message" style="margin-top:12px">Treść</label>
    <textarea id="message" name="message" maxlength="2000" required
      placeholder="Co dodać albo co nie działa? Im konkretniej, tym łatwiej to naprawić."></textarea>

    <div class="row">
      <button type="submit" id="send">Wyślij</button>
      <span class="count" id="count">0 / 2000</span>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>

  <div class="list-head">
    <strong>Zgłoszenia</strong>
    <span class="count-total" id="total"></span>
    <span id="moderator"></span>
    <button type="button" class="refresh" id="refresh">Odśwież</button>
  </div>
  <ul id="list"><li class="empty">Wczytuję…</li></ul>
</main>

<script src="/propozycje.js?v=40"></script>
</body>
</html>

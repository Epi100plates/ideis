<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan zajęć — rocznik, kierunek, specjalność i tryb</title>
<meta name="description" content="Plan zajęć każdego kierunku, rocznika, specjalności i trybu studiów — w interfejsie natywnej aplikacji: dzień, tydzień, miesiąc i semestr, materiały do zajęć i 20 stylów.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#04070c" id="themeColorMeta">

<!-- Styl ustawiamy PRZED pierwszym malowaniem, żeby zimny start PWA nie mignął
     jasnym tłem. Pełny katalog palet jest w app.js — tutaj tylko tło strony. -->
<script src="/theme-boot.js?v=42"></script>

<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan zajęć">

<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=21">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png?v=21">
<link rel="preload" href="/fonts/Roboto-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/Roboto-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/native.css?v=42">
</head>
<body>

<!-- Tło „aurora”: jeden nieruchomy raster gradientów, bez backdrop-filter.
     Kolejne warstwy ustawia app.js z palety wybranego stylu. -->
<div class="aurora" id="aurora" aria-hidden="true"></div>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-day" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><circle cx="12" cy="15" r="2"/></symbol>
  <symbol id="i-week" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10M15 10v10"/></symbol>
  <symbol id="i-month" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-semester" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/></symbol>
  <symbol id="i-options" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <!-- Spinacz materiałów (ic_attachment.xml) — znacznik „te zajęcia mają pliki”. -->
  <symbol id="i-attachment" viewBox="0 0 24 24"><path d="M16.5 6.8V16a4.5 4.5 0 0 1-9 0V6.8a2.6 2.6 0 0 1 5.2 0V15a1.4 1.4 0 0 1-2.8 0V7.4"/></symbol>
  <!-- Okrągły „wstecz” w nagłówkach panelu ustawień (ic_back.xml). -->
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
  <!-- Ikony stron panelu ustawień: Wygląd (ic_settings_look) i Aktualizacje. -->
  <symbol id="i-look" viewBox="0 0 24 24"><path d="M5 3h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M13 11h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2Z"/></symbol>
  <symbol id="i-updates" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10l4.5 4.5L16.5 10"/><path d="M4 17v1.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V17"/></symbol>
  <!-- Ikony materiałów (APK 1.10): pobieranie, kosz, otwarcie linku. -->
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10l4.5 4.5L16.5 10"/><path d="M4 17v1.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V17"/></symbol>
  <symbol id="i-delete" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5v-2A1.5 1.5 0 0 1 11 3h2a1.5 1.5 0 0 1 1.5 1.5v2M6.5 6.5l1 12.5a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2l1-12.5"/><path d="M10.5 10.5V17M13.5 10.5V17"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M13.5 4.5h6v6"/><path d="M19.5 4.5 11 13"/><path d="M18 14.5v4a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
  <!-- Propozycje / błędy (ic_feedback.xml, APK 1.12): dymek rozmowy z kropkami. -->
  <symbol id="i-feedback" viewBox="0 0 24 24"><path d="M4.5 5h15a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-9l-4 3.5v-3.5h-2a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><circle cx="8" cy="10.8" r="1.1" style="fill:currentColor;stroke:none"/><circle cx="12" cy="10.8" r="1.1" style="fill:currentColor;stroke:none"/><circle cx="16" cy="10.8" r="1.1" style="fill:currentColor;stroke:none"/></symbol>
  <!-- Telefon: kafelek „Aplikacja Android” w Opcjach. -->
  <symbol id="i-android" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/><path d="M10.5 5.5h3M12 18h.01"/></symbol>
  <!-- Instalacja (PWA/APK): strzałka wchodząca do tacki — kafelek „Zainstaluj aplikację”. -->
  <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 3.5v10"/><path d="M8 9.5 12 13.5l4-4"/><path d="M4.5 15.5v2.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2.5"/></symbol>
</svg>

<!-- Ekran powitalny: wybór planu krok po kroku (natywny ekran startowy).
     Na starcie widać tylko rocznik — kolejne kroki dorysowuje `pickerHtml`
     w `app.js`, gdy poprzedni jest wybrany. -->
<section class="welcome" id="welcome" hidden aria-labelledby="welcomeTitle">
  <h1 class="welcome-title" id="welcomeTitle">Plan zajęć</h1>
  <p class="welcome-faculty" id="welcomeFaculty"></p>
  <div class="welcome-picker" id="welcomePicker"></div>
  <div class="welcome-manual" id="welcomeManualBox" hidden>
    <label class="field">
      <input type="text" id="welcomeManual" inputmode="numeric" autocomplete="off"
             maxlength="8" placeholder=" " aria-label="Albo numer grupy">
      <span>Albo numer grupy</span>
    </label>
    <button type="button" class="btn-tonal" id="welcomeManualGo" disabled>Użyj</button>
  </div>
  <button type="button" class="text-btn welcome-more" id="welcomeManualToggle"
          aria-expanded="false" aria-controls="welcomeManualBox">Mam numer grupy</button>
</section>

<!-- Główny ekran: kompaktowy nagłówek + widoki + dolne kafelki.
     Paska statusu nie ma — „zaktualizowano …”, offline i styl mieszkają
     w arkuszu „Opcje” (piąty kafelek), jak w natywnej aplikacji. -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="topbar-title">
      <h1>Plan zajęć</h1>
      <p class="topbar-group" id="groupSub">grupa 21188</p>
    </div>
    <div class="topbar-actions">
      <button type="button" class="text-btn" id="btnRefresh">Odśwież</button>
    </div>
  </header>

  <div class="refresh-line" id="refreshLine" hidden><span></span></div>
  <div class="pull-indicator" id="pullIndicator" hidden><span></span></div>

  <main class="viewport" id="viewport" aria-live="polite"></main>

  <div class="bottom-bar">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Widok">
      <span class="tab-indicator" aria-hidden="true"></span>
      <button type="button" role="tab" data-view="day" aria-selected="true">
        <svg><use href="#i-day"/></svg><span>Dzień</span>
      </button>
      <button type="button" role="tab" data-view="week" aria-selected="false">
        <svg><use href="#i-week"/></svg><span>Tydzień</span>
      </button>
      <button type="button" role="tab" data-view="month" aria-selected="false">
        <svg><use href="#i-month"/></svg><span>Miesiąc</span>
      </button>
      <button type="button" role="tab" data-view="semester" aria-selected="false">
        <svg><use href="#i-semester"/></svg><span>Semestr</span>
      </button>
      <button type="button" class="tab-options" id="btnOptions" aria-label="Opcje">
        <span class="tab-badge" id="optionsBadge" hidden></span>
        <svg><use href="#i-options"/></svg><span>Opcje</span>
      </button>
    </nav>
  </div>
</div>

<!-- ModalBottomSheet: grupa, styl, szczegóły zajęć. tabindex="-1" — focus
     wchodzi do środka także wtedy, gdy arkusz nie ma przycisków. -->
<div class="sheet-scrim" id="sheetScrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<!-- AlertDialog: potwierdzenie usunięcia, dodawanie linku. -->
<div class="dialog-scrim" id="dialogScrim" hidden></div>
<div class="dialog" id="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1">
  <h2 id="dialogTitle"></h2>
  <div class="dialog-text" id="dialogText"></div>
  <div class="dialog-actions" id="dialogActions"></div>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="filePicker" class="visually-hidden" tabindex="-1" aria-hidden="true">

<script src="/selection.js?v=42"></script>
<script src="/wizard.js?v=42"></script>
<script src="/styles.js?v=42"></script>
<script src="/schedule.js?v=42"></script>
<script src="/visit-ping.js?v=42"></script>
<script src="/app.js?v=42"></script>
</body>
</html>
